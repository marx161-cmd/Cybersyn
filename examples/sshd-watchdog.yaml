name: sshd poll watchdog
description: >
  Restore sshd only when it is actually down.

  The previous task ran "Restore SSHD" unconditionally with no health check, and its
  flow.wait(300000) never elapsed because RESTART mode cancelled and relaunched the task
  every minute -- so a "poll every 5 minutes" watchdog restarted sshd every minute.

  Now: one script that checks the listening port (not pgrep, which is blind under
  hidepid without AID_READPROC) and restores inline only when that fails. The restore
  cannot be a second task action -- continueOnError:false stops on ERROR, so a healthy
  check would fall through and restore anyway while an unhealthy one would abort before
  it could. Loop dropped; the TIME context already pulses once a minute, so SINGLE is
  correct.
tasks:
  - name: "sshd: poll watchdog check"
    priority: 5
    collisionMode: ABORT_NEW
    actions:
      - type: script.termux.run
        label: check sshd is listening
        continueOnError: false
        args:
          executable: ~/.termux/tasker/sshd_watchdog.sh
          arguments: ""
          useRoot: "true"
          timeoutMs: "20000"
profiles:
  - name: SshdPollWatchdog
    enabled: true
    group: System
    automationMode: SINGLE
    cooldownSec: 0
    enterTask: "sshd: poll watchdog check"
    contexts:
      - type: TIME
        config:
          start: "00:00"
          end: "23:59"
