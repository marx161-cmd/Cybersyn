name: Quick Tap sidebar toggle
description: Route Pixel Quick Tap relay events to the Smart Edge sidebar toggle intent.
tasks:
  - name: QuickTap Toggle Sidebar
    priority: 6
    collisionMode: ABORT_NEW
    actions:
      - type: intent.launch
        label: Toggle Smart Edge sidebar
        args:
          uri: "#Intent;action=com.imi.smartedge.sidebar.panel.TOGGLE;extendedLaunchFlags=0x4;component=com.imi.smartedge.sidebar.panel/.ToggleActivity;end"
profiles:
  - name: QuickTapSidebarTrigger
    enabled: true
    group: Input
    automationMode: RESTART
    enterTask: QuickTap Toggle Sidebar
    contexts:
      - type: EVENT
        config:
          event: external_trigger
          trigger: quick_tap
