name: Quick Tap volume slider
description: Route Pixel Quick Tap relay events to show the volume slider.
tasks:
  - name: QuickTap Toggle Sidebar
    priority: 6
    collisionMode: ABORT_NEW
    actions:
      - type: key.send
        label: Show volume slider
        args:
          code: KEYCODE_VOLUME_UP
profiles:
  - name: QuickTapSidebarTrigger
    enabled: true
    group: Input
    automationMode: RESTART
    enterTask: QuickTap Toggle Sidebar
    contexts:
      - type: EVENT
        config:
          event: external_trigger
          trigger: quick_tap
