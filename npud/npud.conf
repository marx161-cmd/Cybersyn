# npud backend table.
#
# One [section] per worker type. The section name is the "kind" clients send and
# the subdirectory models live in: <model-dir>/<kind>/<name>.<ext>
#
# Adding a worker type is an edit here plus a restart — never a rebuild. Verify
# tokens against the worker's own source in
# ~/builds/android/LiteRT/litert/tools/*_g5_worker.cc rather than guessing; they
# are not consistent between workers (POLL_E_READY vs KOKORO_G5_READY vs
# WHISPER_G5_OK), which is exactly why this is data and not code.
#
# Keys:
#   binary      absolute path to the worker executable        (required)
#   ready       token printed once the model is loaded        (required)
#   end         token ending a response (or signalling OK)    (required)
#   ext         file extension identifying this kind's models (required)
#   begin       token starting a response body; omit for single-line replies
#   error       token identifying an error reply              (default: ERROR)
#   model_flag  how the model path is passed  (default: --model_path=)
#   args        fixed arguments, whitespace-separated
#
# npud always appends --litert_dispatch_lib_dir=<dispatch-dir> and sets
# LD_LIBRARY_PATH to "<dispatch-dir>:<worker-dir>:/system/lib64:/vendor/lib64".
# That order matters: the dispatch dir carries the complete tachyon toolchain and
# must beat any partial copy beside the binary, and /system/lib64 must precede
# /vendor/lib64 or the vendor libbinder (no PermissionCache) shadows the
# framework one and the worker dies on a missing symbol.

# Gemma and friends. Binary name is a Poll-E leftover — that project was merged
# into Agora, but the worker binary kept its original name and protocol.
[llm]
binary = /data/local/tmp/npu/bin/libpoll_e_worker.so
ready = POLL_E_READY
begin = POLL_E_BEGIN
end = POLL_E_END
error = POLL_E_ERROR
ext = litertlm
args = --backend=npu --poll_e_worker --poll_e_max_output_tokens=512

# EmbeddingGemma. Single-line reply (a vector), so no begin token.
[embed]
binary = /data/local/tmp/npu/bin/libembeddinggemma_npu_worker.so
ready = EMBED_READY
end = EMBED_OK
error = EMBED_ERROR
ext = tflite

# Whisper speech-to-text. Note the dispatch flag differs from [llm].
[asr]
binary = /data/local/tmp/npu/bin/libwhisper_g5_worker.so
ready = WHISPER_G5_READY
end = WHISPER_G5_OK
error = WHISPER_G5_ERROR
ext = tflite
dispatch_flag = --dispatch_lib_dir=

# Kokoro TTS. A "model" here is a DIRECTORY of fitted tensors, not one file,
# and requests are raw worker lines ("chain 60 <in_dir> <out.s16le>") rather
# than text — npud passes the payload through verbatim, so that works as-is.
[tts]
binary = /data/local/tmp/npu/bin/libkokoro_g5_worker.so
ready = KOKORO_G5_READY
end = KOKORO_G5_OK
error = KOKORO_G5_ERROR
model_flag = --model_dir=
dispatch_flag = --dispatch_lib_dir=
model_is_dir = 1

# VibeVoice TTS — streaming, kept separate from kokoro so either can be selected
# per request rather than one shadowing the other.
[tts-vibe]
binary = /data/local/tmp/npu/bin/vibevoice_g5_worker
ready = VIBEVOICE_G5_READY
end = VIBEVOICE_G5_OK
error = VIBEVOICE_G5_ERROR
ext = tflite
dispatch_flag = --dispatch_lib_dir=
